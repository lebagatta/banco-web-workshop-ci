# [script de pipeline] YAML (Github Actions, Gitlab, Azure DevOps, CircleCI, etc.)

#     [declaracoes]

name: CI Mentoria

# gatilhos ou triggers
on:
  workflow_dispatch: 

jobs:
  tests:
    #         [config do so] (windows/linux/mac, chrome/firefox, v1/v2)
    runs-on: ubuntu-latest

    #         [variaveis] (variáveis de ambientes, chaves de acesso)
    env:
      API_BASE_URL: 'http://localhost:3000'
      PORT: 4000

    steps:
      #         [projetos] (aplicacoes em teste, projeto de testes, projeto auxiliar, etc)
      - name: Checkout/Clone do Repositório
        uses: actions/checkout@v4

      #         [acoes e passos] (instalar deps, subir servidor, executar testes, publicar relatorios, etc)cancel-timeout-minutes: 
      - name: Instalando deps
        run: npm install

      - name: Iniciar o Mock Server
        run: npm run mock-server

      - name: Iniciar a aplicacao
        run: npm run server

      - name: Executar os testes
        run: npx cypress run
